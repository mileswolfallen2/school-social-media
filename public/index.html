<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SchoolHub</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="bg-decoration" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div id="app">
    <section id="auth-view" class="auth-view hidden">
      <div class="auth-card">
        <div class="brand">
          <div class="brand-badge">S</div>
          <h1>SchoolHub</h1>
          <p>Stay connected with your school community.</p>
        </div>
        <div class="auth-tabs" role="tablist">
          <button class="tab-btn active" data-tab="login">Log in</button>
          <button class="tab-btn" data-tab="register">Sign up</button>
        </div>
        <form id="login-form">
          <label class="field">
            <span>Username</span>
            <input id="login-username" type="text" placeholder="e.g. alex" autocomplete="username" required />
          </label>
          <label class="field">
            <span>Password</span>
            <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required />
          </label>
          <button type="submit" class="btn primary btn-block">Log in</button>
          <p class="demo-hint">Demo accounts: <code>alex</code>, <code>mia</code>, <code>ms.chan</code> — password <code>password123</code></p>
        </form>
        <form id="register-form" class="hidden">
          <label class="field">
            <span>Full name</span>
            <input id="reg-fullname" type="text" placeholder="Jamie Rivera" required />
          </label>
          <label class="field">
            <span>Username</span>
            <input id="reg-username" type="text" placeholder="3–20 characters" required />
          </label>
          <label class="field">
            <span>School email</span>
            <input id="reg-email" type="email" placeholder="you@school.edu" required />
          </label>
          <label class="field">
            <span>Role</span>
            <select id="reg-role">
              <option value="student">Student</option>
              <option value="teacher">Teacher</option>
              <option value="staff">Staff</option>
            </select>
          </label>
          <label class="field">
            <span>Password (8+ characters)</span>
            <input id="reg-password" type="password" autocomplete="new-password" required />
          </label>
          <button type="submit" class="btn primary btn-block">Create account</button>
        </form>
        <p id="auth-error" class="error hidden"></p>
      </div>
    </section>

    <section id="main-view" class="main-view hidden">
      <header class="topbar">
        <div class="topbar-inner">
          <div class="brand-row">
            <div class="brand-badge small">S</div>
            <span>SchoolHub</span>
          </div>
          <div class="topbar-right">
            <span id="welcome" class="welcome"></span>
            <span id="user-role" class="role-badge"></span>
            <button id="logout-btn" class="btn ghost">Log out</button>
          </div>
        </div>
      </header>

      <main class="feed">
        <div class="profile-banner card">
          <div class="avatar profile-avatar" id="profile-avatar"></div>
          <div class="profile-info">
            <div class="profile-name" id="profile-name"></div>
            <div class="profile-meta">
              <span id="profile-role-badge" class="role-badge"></span>
              <span id="profile-username" class="profile-username"></span>
            </div>
          </div>
        </div>

        <div class="composer card">
          <div class="composer-top">
            <div class="avatar composer-avatar" id="composer-avatar"></div>
            <textarea id="post-input" maxlength="500" placeholder="Share something with your school…"></textarea>
          </div>
          <div class="composer-footer">
            <span id="post-char-count" class="char-count">0/500</span>
            <button id="post-submit" class="btn primary">Post</button>
          </div>
        </div>

        <div id="feed" class="feed-list"></div>
        <p id="feed-empty" class="empty hidden">No posts yet. Be the first to share!</p>
      </main>
    </section>
  </div>

  <div id="confirm-modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal card">
      <h3 id="modal-title">Are you sure?</h3>
      <p id="modal-text">This can't be undone.</p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn ghost">Cancel</button>
        <button id="modal-confirm" class="btn danger">Delete</button>
      </div>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
